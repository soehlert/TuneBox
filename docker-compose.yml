services:
  frontend:
    build:
      context: .
      dockerfile: Compose/frontend/Dockerfile
    ports:
      - "0.0.0.0:80:80"
    environment:
      - TUNEBOX_URL=${TUNEBOX_URL:-backend:8000}
    volumes:
      - ./frontend/.env:/app/.env
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: Compose/backend/Dockerfile
    environment:
      - PLEX_USERNAME=${PLEX_USERNAME}
      - PLEX_SERVER_NAME=${PLEX_SERVER_NAME}
      - CLIENT_NAME=${CLIENT_NAME}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - TUNEBOX_URL=${TUNEBOX_URL:-backend:8000}
      - INDEX_INTERVAL_HOURS=${INDEX_INTERVAL_HOURS:-24}
      - TESTING=${TESTING:-false}
    volumes:
      - ./backend:/app/backend
      - ./.env:/app/.env
    depends_on:
      - redis

  redis:
    image: "redis:alpine"
